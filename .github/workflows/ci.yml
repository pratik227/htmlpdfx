name: CI

on:
  push:
    branches: [main]
  pull_request:

# puppeteer is an optional dependency that bundles Chromium. Skip that ~150MB
# download for the build/unit/browser jobs — they don't need a real browser
# (browser jobs install Playwright explicitly; the core unit suite is engine
# -agnostic). The dedicated e2e job re-enables the download below.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # The test suite runs on Node 20+ because Vitest 4 requires it
  # (engines: ^20 || ^22 || >=24). The library itself still supports Node 18 —
  # that's what the `node18-compat` job below is for.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # package.json promises `engines.node: >=18`, so keep proving the package
  # builds and its types resolve there. Only the test runner needs a newer
  # Node, not the shipped code — if this job breaks, the promise is broken and
  # `engines` has to change (a major release).
  node18-compat:
    name: node 18 build + types (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      # Vitest 4 is in devDependencies and doesn't support Node 18, which npm
      # reports as EBADENGINE. That's expected here and not fatal.
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  # Same suite under Bun.
  bun:
    name: bun (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bunx vitest run

  # Real cross-browser rendering: Chromium, Firefox, WebKit (Safari engine).
  browser:
    name: browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      # Drive the UMD/ESM/Vue/React examples and assert each downloads a PDF.
      - run: npm run test:browser-download
        env:
          HTMLPDFX_BROWSER_REQUIRE: "1"

  # End-to-end Chromium PDF: render real HTML and ASSERT on the produced PDF
  # (page count, selectable text, repeating headers, links, outline, pooling).
  e2e-chromium:
    name: e2e chromium (ubuntu)
    runs-on: ubuntu-latest
    env:
      # Treat a missing browser as a failure, not a silent skip…
      HTMLPDFX_E2E_REQUIRE: "1"
      # …and pin the driver to the one we install a browser for below, so the
      # test doesn't depend on puppeteer's (flaky) optional Chromium download.
      HTMLPDFX_E2E_DRIVER: "playwright"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Build the docs site and verify every internal link resolves (no 404s).
  docs:
    name: docs (link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:build
      - name: Serve docs and check links
        env:
          BASE: http://localhost:4173
        run: |
          npx vitepress preview docs --port 4173 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 >/dev/null && break
            sleep 1
          done
          npm run docs:check-links
          kill $SERVER_PID 2>/dev/null || true
