name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit tests + build across all three desktop OSes and supported Node versions.
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Skip the optional puppeteer/Chromium download: unit tests cover the
      # engine-agnostic core. The dedicated e2e job exercises the real browser.
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # Same unit suite under Bun.
  bun:
    name: bun (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --omit=optional
      - run: bun run build
      - run: bunx vitest run

  # Real cross-browser rendering: Chromium, Firefox, WebKit (Safari engine).
  browser:
    name: browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  # End-to-end Chromium PDF via Puppeteer.
  e2e-chromium:
    name: e2e chromium (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm i puppeteer --no-save
      - run: npm run build
      - run: node examples/node-basic.mjs || true
