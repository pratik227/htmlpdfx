name: CI

on:
  push:
    branches: [main]
  pull_request:

# puppeteer is an optional dependency that bundles Chromium. Skip that ~150MB
# download for the build/unit/browser jobs — they don't need a real browser
# (browser jobs install Playwright explicitly; the core unit suite is engine
# -agnostic). The dedicated e2e job re-enables the download below.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # Unit tests + build across all three desktop OSes and supported Node versions.
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # Same unit suite under Bun.
  bun:
    name: bun (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bunx vitest run

  # Real cross-browser rendering: Chromium, Firefox, WebKit (Safari engine).
  browser:
    name: browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  # End-to-end Chromium PDF: render real HTML and ASSERT on the produced PDF
  # (page count, selectable text, repeating headers, links, outline, pooling).
  e2e-chromium:
    name: e2e chromium (ubuntu)
    runs-on: ubuntu-latest
    env:
      # This job needs a real browser, so allow puppeteer's Chromium download…
      PUPPETEER_SKIP_DOWNLOAD: "false"
      # …and treat a missing browser as a failure, not a silent skip.
      HTMLPDFX_E2E_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
