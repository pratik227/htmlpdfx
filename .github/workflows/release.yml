# Publishing
#
#   1. Move the `## [Unreleased]` entries in CHANGELOG.md under a new version
#      heading, and update the compare/tag links at the bottom.
#   2. `npm version <patch|minor|major>` — this commits and tags `vX.Y.Z`.
#   3. `git push && git push --tags`
#
# Pushing the tag runs this workflow: it re-verifies the package, publishes to
# npm with provenance, and opens a GitHub Release. Nothing is published unless
# every check below passes.
#
# One-time setup: add an npm automation token as the `NPM_TOKEN` repo secret
# (npmjs.com -> Access Tokens -> Generate -> Automation). Provenance also needs
# the `id-token: write` permission granted below, and a public repo.

name: Release

on:
  push:
    tags: ["v*"]
  # Allows a dry run — verifies and packs, but never publishes.
  workflow_dispatch:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name. Fail loudly instead.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Check CHANGELOG has an entry for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="$(node -p "require('./package.json').version")"
          grep -q "^## \[$PKG\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$PKG]' section"; exit 1; }

      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # The real output guarantees: page count, selectable text, repeating
      # <thead>, links, outline, pooling — asserted against actual PDF bytes.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          HTMLPDFX_E2E_REQUIRE: "1"
          HTMLPDFX_E2E_DRIVER: "playwright"

      # Catch a broken `files` array or a missing entry point before it ships.
      - name: Verify the tarball resolves every export
        run: |
          npm pack
          mkdir -p /tmp/smoke && tar xzf htmlpdfx-*.tgz -C /tmp/smoke
          cd /tmp/smoke/package
          for f in dist/index.js dist/index.cjs dist/index.d.ts \
                   dist/browser.js dist/react.js dist/vue.js \
                   dist/htmlpdfx.global.js README.md LICENSE; do
            [ -f "$f" ] || { echo "::error::missing $f in tarball"; exit 1; }
          done
          node -e "import('./dist/index.js').then(m => {
            for (const x of ['toPdf', 'htmlpdfx', 'html2pdf', 'createRenderer']) {
              if (!(x in m)) throw new Error('missing export: ' + x);
            }
            console.log('ESM exports OK');
          })"
          node -e "const m = require('./dist/index.cjs');
            if (typeof m.toPdf !== 'function') throw new Error('CJS toPdf missing');
            console.log('CJS exports OK');"

  publish:
    name: publish to npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for what changed in this release." \
            --verify-tag
