[build]
  command = "npm run docs:build"
  publish = "docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "20"

# The docs load nothing from another origin — icons are inlined SVG at build
# time and there are no webfonts — so `default-src 'self'` costs us nothing and
# blocks injected scripts, frames, and beacons outright.
#
# `'unsafe-inline'` stays for scripts and styles because VitePress emits an
# inline script to set the colour theme before first paint, and Vue writes
# inline styles. Removing it needs per-response nonces, which a static host
# can't do; the remaining directives are what actually limit the damage.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Agent- and crawler-facing plain text. Served as UTF-8 text so a fetch shows
# the content instead of triggering a download.
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Markdown sources sit beside each page for agents that want the source rather
# than the rendered HTML.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted bundles are safe to cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
